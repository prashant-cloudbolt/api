name: API Release and Deploy

on:
  push:
    branches:
      - multi_tenant_dev
      - multi_tenant_stage

permissions:
  id-token: write 
  contents: read
  pull-requests: write
  security-events: write
  actions: read

jobs:
  #############################################################
  ## Reuse workflow for CSMP Stage
  #############################################################
  codedeploy_stage:
    if: github.ref == 'refs/heads/multi_tenant_stage'
    uses: ./.github/workflows/codedeploy-stage.yml
    secrets: inherit

  qa_automation:
    if: github.ref == 'refs/heads/multi_tenant_stage'
    needs: [codedeploy_stage]
    uses: ./.github/workflows/qa-automation.yml
    secrets: inherit

  test:
    needs: [qa_automation]
    runs-on: ubuntu-latest
    steps:
      - name: Debug QA Job Status
        run: |
          echo "QA Job Status: ${{ needs.qa_automation.outputs.job_status }}"
          echo "QA Job Status of csmp_v2_stage_api_test: ${{ needs.qa_automation.outputs.csmp_v2_stage_api_test }}"
          echo "QA Job Status of csmp_stage_smoke_test: ${{ needs.qa_automation.outputs.csmp_stage_smoke_test }}"

  codedeploy_rollback_stage:
    if: ${{ always() && needs.qa_automation.outputs.job_status == 'failure' && github.ref == 'refs/heads/multi_tenant_stage' }}
    needs: [codedeploy_stage, qa_automation]
    uses: ./.github/workflows/codedeploy-stage.yml
    with:
      codedeploy_rollback: True
      csmp_v2_stage_api_test_status: ${{ needs.qa_automation.outputs.csmp_v2_stage_api_test }}
      csmp_stage_smoke_test_status: ${{ needs.qa_automation.outputs.csmp_stage_smoke_test }}
    secrets: inherit

  release_stage:
    if: ${{ always() && needs.qa_automation.outputs.job_status == 'success' && github.ref == 'refs/heads/multi_tenant_stage' }}
    needs: [codedeploy_stage, qa_automation]
    uses: ./.github/workflows/release-version.yml
    with:
      environment: CSMP_Stage
      branch: multi_tenant_stage
    secrets: inherit

  # #############################################################
  # ## Reuse workflow for MIRA Stage
