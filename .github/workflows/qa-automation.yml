name: qa-automation

on:
  workflow_call:
    outputs:
      csmp_v2_stage_api:
        description: "csmp_stage_V2_api_test result"
        value: ${{ jobs.qa_jobs_status.outputs.csmp_v2_stage_api }}
      csmp_stage_smoke_test:
        description: "csmp_stage_smoke_test result"
        value: ${{ jobs.qa_jobs_status.outputs.csmp_stage_smoke_test }}

permissions:
  id-token: write 
  contents: read
  pull-requests: write
  security-events: write
  actions: read

jobs:
  csmp_stage_api:
    runs-on: ubuntu-latest
    outputs:
      test_result: ${{ steps.check_api_status.outputs.csmp_v2_stage_api }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run csmp_stage_V2_api_test.yml workflow
        id: run_api_test
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh workflow run csmp_stage_V2_api_test.yml --repo prashant-cloudbolt/qa-automation
          echo "Waiting 10 seconds before checking for workflow run ID..."
          sleep 10

      - name: Get csmp_stage_V2_api_test.yml Run ID
        id: get_api_test_run_id
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          max_attempts=10
          attempt=0
          run_id=""
          
          while [ -z "$run_id" ] && [ $attempt -lt $max_attempts ]; do
            echo "Attempt $((attempt + 1)) to retrieve workflow run ID"
            run_id=$(gh run list --repo prashant-cloudbolt/qa-automation --workflow=csmp_stage_V2_api_test.yml --limit=1 --json databaseId | jq -r '.[0].databaseId')
            
            if [ -z "$run_id" ]; then
              echo "Workflow run ID not yet available. Retrying..."
              attempt=$((attempt + 1))
              sleep 10
            fi
          done

          if [ -z "$run_id" ]; then
            echo "Failed to retrieve workflow run ID"
            exit 1
          fi

          echo "API Test Run ID: $run_id"
          echo "run_id_api=$run_id" >> $GITHUB_ENV

      - name: Check Status of csmp_stage_V2_api_test.yml
        id: check_api_status
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          status=""
          while [ "$status" != "completed" ]; do
            status=$(gh run view ${{ env.run_id_api }} --repo prashant-cloudbolt/qa-automation --json status --jq '.status')
            echo "API Test Current Status: $status"
            sleep 10
          done

          conclusion=$(gh run view ${{ env.run_id_api }} --repo prashant-cloudbolt/qa-automation --json conclusion --jq '.conclusion')
          echo "API Test Final conclusion: $conclusion"
          echo "csmp_v2_stage_api=$conclusion" >> $GITHUB_OUTPUT

  csmp_stage_smoke:
    runs-on: ubuntu-latest
    outputs:
      test_result: ${{ steps.check_smoke_status.outputs.csmp_stage_smoke_test }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run csmp_stage_smoke_test.yml workflow
        id: run_smoke_test
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh workflow run csmp_stage_smoke_test.yml --repo prashant-cloudbolt/qa-automation
          echo "Waiting 10 seconds before checking for workflow run ID..."
          sleep 10

      - name: Get csmp_stage_smoke_test.yml Run ID
        id: get_smoke_test_run_id
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          max_attempts=10
          attempt=0
          run_id=""
          
          while [ -z "$run_id" ] && [ $attempt -lt $max_attempts ]; do
            echo "Attempt $((attempt + 1)) to retrieve workflow run ID"
            run_id=$(gh run list --repo prashant-cloudbolt/qa-automation --workflow=csmp_stage_smoke_test.yml --limit=1 --json databaseId | jq -r '.[0].databaseId')
            
            if [ -z "$run_id" ]; then
              echo "Workflow run ID not yet available. Retrying..."
              attempt=$((attempt + 1))
              sleep 10
            fi
          done

          if [ -z "$run_id" ]; then
            echo "Failed to retrieve workflow run ID"
            exit 1
          fi

          echo "Smoke Test Run ID: $run_id"
          echo "run_id_smoke=$run_id" >> $GITHUB_ENV

      - name: Check Status of csmp_stage_smoke_test.yml
        id: check_smoke_status
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          status=""
          while [ "$status" != "completed" ]; do
            status=$(gh run view ${{ env.run_id_smoke }} --repo prashant-cloudbolt/qa-automation --json status --jq '.status')
            echo "Smoke Test Current status: $status"
            sleep 10
          done

          conclusion=$(gh run view ${{ env.run_id_smoke }} --repo prashant-cloudbolt/qa-automation --json conclusion --jq '.conclusion')
          echo "Smoke Test Final conclusion: $conclusion"
          echo "csmp_stage_smoke_test=$conclusion" >> $GITHUB_OUTPUT

  qa_jobs_status:
    needs: [csmp_stage_api, csmp_stage_smoke]
    runs-on: ubuntu-latest
    if: always()
    outputs:
      csmp_v2_stage_api: ${{ steps.set_status.outputs.csmp_v2_stage_api }}
      csmp_stage_smoke_test: ${{ steps.set_status.outputs.csmp_stage_smoke_test }}
    steps:
      - name: Set final job status
        id: set_status
        run: |
          echo "csmp_v2_stage_api=${{ needs.csmp_stage_api.outputs.test_result }}" >> $GITHUB_OUTPUT
          echo "csmp_stage_smoke_test=${{ needs.csmp_stage_smoke.outputs.test_result }}" >> $GITHUB_OUTPUT