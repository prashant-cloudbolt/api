name: qa-automation

on:
  workflow_call:
    outputs:
      job_status:
        description: "QA Automation job status"
        value: ${{ jobs.qa_tests.outputs.job_status }}

permissions:
  id-token: write 
  contents: read
  pull-requests: write
  security-events: write
  actions: read

jobs:
  qa_tests:
    runs-on: ubuntu-latest
    outputs:
      job_status: ${{ steps.check_status.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate token
        id: generate-token
        uses: tibdex/github-app-token@v2.1.0
        with:
          app_id: 175452
          private_key: ${{ secrets.CLOUDBOLT_ACTION_HELPER_PEM }}

      - name: Run maven.yml workflow in qa-automation repository
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: gh workflow run maven.yml --repo CloudBoltSoftware/qa-automation

      - name: Get Workflow Run ID of maven.yml workflow
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          max_attempts=5  # Maximum number of attempts to retrieve the workflow run ID
          attempt=0
          workflow_list=""

          while [ -z "$workflow_list" ] && [ $attempt -lt $max_attempts ]; do
            echo "Attempt $((attempt + 1)) to retrieve workflow run ID"
            workflow_list=$(gh run list --repo CloudBoltSoftware/qa-automation --workflow=maven.yml --limit=1 --json databaseId)
            
            if [ -z "$workflow_list" ]; then
              echo "Workflow run ID not yet available. Retrying..."
              attempt=$((attempt + 1))
              sleep 10  # Wait for a short time before retrying
            else
              echo "Workflow run ID retrieved successfully."
            fi
          done

          if [ -z "$workflow_list" ]; then
            echo "Failed to retrieve workflow run ID after $max_attempts attempts"
            exit 1
          fi

          run_id=$(echo "$workflow_list" | jq -r '.[0].databaseId')
          echo "run_id=$run_id" >> $GITHUB_ENV


      - name: Check Target Workflow Status of maven.yml
        id: check_status
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        continue-on-error: true  # Continue even if the command fails, so output is set correctly
        run: |
          status=""
          while [ "$status" != "completed" ]; do
            status=$(gh run view ${{ env.run_id }} --repo CloudBoltSoftware/qa-automation --json status --jq '.status')
            echo "Current status: $status"
            if [ "$status" == "completed" ]; then
              conclusion=$(gh run view ${{ env.run_id }} --repo CloudBoltSoftware/qa-automation --json conclusion --jq '.conclusion')
              echo "Final conclusion: $conclusion"
              if [ "$conclusion" != "success" ]; then
                echo "Target workflow failed. Failing source workflow."
                echo "status=failure" >> $GITHUB_OUTPUT
                exit 1
              else
                echo "status=success" >> $GITHUB_OUTPUT
              fi
            fi
            sleep 15  # Increased sleep to reduce API calls
          done

      - name: QA Job Status Result
        run: |
          echo "QA Job status : ${{ steps.check_status.outputs.status }}"

      - name: Notify failure to Slack
        uses: act10ns/slack@v2.0.0
        if: ${{ failure() }} # This ensures the step runs only if the previous steps fail
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOYMENT_NOTIFICATION_WEBHOOK }} 
        with:
          status: ${{ job.status }}
          message: |
            :rotating_light: *QA Tests Failed*: API Deployment for CSMP-STAGE Environment
            Repository: ${{ github.repository }}
            Pipeline URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}